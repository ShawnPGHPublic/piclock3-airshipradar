# A clock whose ships come from an AIS-catcher on this network:
#
#   python3 PyQtPiClock3.py plugins/AirShipRadar/examples/aiscatcher.yaml
#
# Managed mode serves the control panel on 8118 and the map on 8119:
#
#   AIS-catcher -E /config/config.json 0.0.0.0:8118
#
# 8119 is the web viewer (the page with the map).  8118 does not serve
# this list.  A standalone AIS-catcher -N 8100 uses port 8100 instead.
# Put that machine's address in aiscatcher-url below.  A host and port
# is enough: the widget asks for /api/ships.json.
#
# Aircraft stay on adsb.lol.  Set flights: off if you only want the ships.
#
# If /api/ships.json answers 404 because only the newer API is switched
# on, set the full path instead:
#
#   aiscatcher-url: http://192.168.1.50:8111/api/v1/vessels
#
# A v1 API listening on the LAN (not just 127.0.0.1) wants a key, or
# "public": true in the AIS-catcher config.  The key is a Bearer token,
# not the AISStream key:
#
#   token: '{apikeys.aiscatcher}'
#
# and in ApiKeys.yaml:
#
#   aiscatcher: YOUR_KEY

pages:
  clock-page: {order: 0, layout: circle, theme: circuit}

language: en

location:
  latitude: 40.66
  longitude: -74.05
  timezone: America/New_York

widgets:
  clock: {plugin: PiClock3.AnalogClock, region: clock}
  date:  {plugin: PiClock3.Date, region: date}

  traffic:
    plugin: plugins.AirShipRadar
    region: radar
    latitude: 40.66
    longitude: -74.05
    bearing: 0
    radius: 25
    radius-unit: mi
    ships: aiscatcher
    aiscatcher-url: http://192.168.1.50:8119
    flights: adsb
    refresh: 10
    font-size: 0.042

logging-level: info
